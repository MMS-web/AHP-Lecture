<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محاكاة عملية التحليل الهرمي (AHP): النقل المستدام</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --sap:#72B0AB;
  --arc:#BCDDDC;
  --lace:#FFEDD1;
  --bub:#FDC1B4;
  --bal:#FE9179;
  --bg:#FFF6E6;
  --card:#FFFFFF;
  --ink:#1F4A47;
  --mut:#4F7471;
  --line:#BCDDDC;
  --tint:#EEF7F6;
  box-sizing:border-box;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10211f;
    --card:#18302d;
    --ink:#FFEDD1;
    --mut:#BCDDDC;
    --line:#2e5551;
    --tint:#1e3b38;
  }
}

:root[data-theme="dark"]{
  --bg:#10211f;
  --card:#18302d;
  --ink:#FFEDD1;
  --mut:#BCDDDC;
  --line:#2e5551;
  --tint:#1e3b38;
}

*{
  box-sizing:border-box;
}

html{
  scroll-padding-top:90px;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Tajawal',Tahoma,Arial,sans-serif;
  line-height:1.85;
  padding-bottom:40px;
}

header{
  background:linear-gradient(
    135deg,
    var(--sap),
    var(--arc) 65%,
    var(--lace)
  );
  color:#16403d;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
  padding:
    calc(8px + env(safe-area-inset-top,0px))
    14px
    8px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  gap:4px 14px;
  text-align:center;
}

header p{
  margin:0;
  background:var(--bal);
  color:#fff;
  border-radius:99px;
  padding:0 12px;
  font-weight:700;
  font-size:13px;
}

header .c{
  display:inline-block;
  background:var(--bal);
  color:#fff;
  border-radius:99px;
  padding:0 12px;
  font-weight:700;
  font-size:13px;
}

header h1{
  margin:0;
  font-size:clamp(15px,2.4vw,19px);
  font-weight:800;
}

header h1 small{
  font-size:1em;
  font-weight:800;
  direction:ltr;
  unicode-bidi:isolate;
  margin-inline-start:8px;
}

main{
  max-width:880px;
  margin:6px auto 30px;
  padding:0 14px;
}

.prog{
  display:flex;
  gap:6px;
  position:sticky;
  top:var(--hh,56px);
  z-index:9;
  background:var(--bg);
  padding:8px 0;
  margin-bottom:6px;
}

.prog i{
  flex:1;
  height:8px;
  border-radius:8px;
  background:var(--arc);
  opacity:.6;
}

.prog i.on{
  background:var(--bal);
  opacity:1;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:22px;
  box-shadow:0 8px 28px rgba(114,176,171,.25);
}

h2{
  margin:6px 0;
  font-size:22px;
  color:var(--ink);
}

h3{
  margin:16px 0 4px;
  color:var(--ink);
}

p{
  margin:.4em 0;
}

.tag{
  display:inline-block;
  background:var(--sap);
  color:#fff;
  border-radius:99px;
  padding:0 12px;
  font-size:13px;
  font-weight:700;
}

.en{
  direction:ltr;
  unicode-bidi:isolate;
  font-weight:500;
}

.grid{
  display:grid;
  gap:10px;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  margin:12px 0;
}

.box{
  border-radius:16px;
  padding:12px 14px;
  background:var(--tint);
  border:1px solid var(--line);
}

.box b{
  display:block;
  color:var(--ink);
}

.box.one b{
  display:inline;
}

.box.w{
  background:var(--lace);
  color:#5b3a24;
}

.box.p{
  background:var(--bub);
  color:#5b2a1c;
}

.box.a{
  background:var(--arc);
  color:#16403d;
}

.k{
  color:#A8321A;
  font-weight:800;
  font-size:1.1em;
}

.th{
  display:block;
  white-space:nowrap;
  margin-top:2px;
  font-weight:700;
}

.tree{
  overflow-x:auto;
}

.tree svg{
  min-width:560px;
  width:100%;
  height:auto;
}

.pair{
  display:grid;
  grid-template-columns:130px 1fr 130px;
  gap:10px;
  align-items:center;
  margin-top:16px;
}

.pair .l{
  font-weight:700;
  text-align:center;
  border-radius:12px;
  padding:6px;
  background:var(--lace);
  color:#5b3a24;
  font-size:14px;
}

input[type=range]{
  width:100%;
  accent-color:var(--bal);
  direction:rtl;
}

.say{
  text-align:center;
  color:var(--mut);
  font-size:15px;
  min-height:26px;
}

.say b{
  color:#c2553a;
}

.btns{
  display:flex;
  justify-content:space-between;
  gap:8px;
  flex-wrap:wrap;
  margin-top:20px;
}

button{
  font-family:inherit;
  font-size:16px;
  font-weight:700;
  border:0;
  border-radius:14px;
  padding:10px 22px;
  cursor:pointer;
  background:var(--bal);
  color:#fff;
}

button.g{
  background:transparent;
  color:var(--ink);
  border:2px solid var(--sap);
}

button:disabled{
  opacity:.4;
  cursor:default;
}

.hint{
  background:var(--lace);
  color:#5b3a24;
  border-right:6px solid var(--bal);
  border-radius:12px;
  padding:10px 14px;
  margin:14px 0;
  font-size:15px;
}

.bar{
  display:grid;
  grid-template-columns:150px 1fr 52px;
  gap:8px;
  align-items:center;
  margin:8px 0;
  font-size:15px;
}

.bar .t{
  background:var(--arc);
  border-radius:99px;
  height:18px;
  overflow:hidden;
}

.bar .t span{
  display:block;
  height:100%;
  background:linear-gradient(
    90deg,
    var(--sap),
    var(--bal)
  );
  border-radius:99px;
  transition:width .6s;
}

.win{
  font-size:20px;
  text-align:center;
  background:var(--sap);
  color:#fff;
  border-radius:16px;
  padding:14px;
  margin:12px 0;
  font-weight:700;
}

.cr{
  border-radius:12px;
  padding:10px 14px;
  font-weight:700;
  margin:8px 0;
}

.ok{
  background:var(--arc);
  color:#16403d;
}

.no{
  background:var(--bub);
  color:#7a2410;
}

.f{
  direction:ltr;
  text-align:center;
  background:var(--tint);
  border:1px dashed var(--sap);
  border-radius:12px;
  padding:8px;
  margin:8px 0;
  font-family:Georgia,'Times New Roman',serif;
  font-size:17px;
  overflow-x:auto;
}

table{
  border-collapse:collapse;
  width:100%;
  font-size:14px;
  text-align:center;
}

td,th{
  border:1px solid var(--line);
  padding:5px;
}

th{
  background:var(--arc);
  color:#16403d;
}

ul.ref{
  padding:0 0 0 20px;
  direction:ltr;
  text-align:left;
}

ul.ref li{
  margin-bottom:8px;
}

a{
  color:#c2553a;
  word-break:break-word;
}

.fix{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:9;
  background:var(--sap);
  color:#fff;
  text-align:center;
  font-weight:700;
  font-size:13px;
  padding:
    4px 10px
    calc(4px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -4px 16px rgba(0,0,0,.12);
  line-height:1.4;
}

@media(max-width:560px){

  .pair{
    grid-template-columns:1fr 1fr;
  }

  .pair input{
    grid-column:1/3;
    grid-row:2;
  }

  .bar{
    grid-template-columns:100px 1fr 46px;
  }

  .card{
    padding:17px;
  }
}
</style>
</head>

<body>

<header>

  <span class="c">
    مقرر صنع السياسات البيئية
  </span>

  <h1>
    عملية التحليل الهرمي (AHP)
    <small>Analytic Hierarchy Process</small>
  </h1>

  <p>
    محاكاة تفاعلية: كيف نختار نظام النقل المستدام لمدينتنا؟
  </p>

</header>

<main>

  <div class="prog" id="prog"></div>

  <div class="card" id="view"></div>

</main>

<div class="fix">
  د. مها محمود الصباغ - جامعة الخليج العربي
</div>

<script>


/* =========================
   البيانات الأساسية
========================= */

const C = [
  "البيئي: خفض الانبعاثات",
  "الاقتصادي: التكلفة",
  "الاجتماعي: سهولة الوصول"
];

const A = [
  "حافلات كهربائية",
  "سيارات هجينة",
  "مسارات المشي والدراجات"
];

const P3 = [
  [0,1],
  [0,2],
  [1,2]
];

const NM = {
  2:"قيمة وسطية",
  3:"أفضلية متوسطة",
  4:"قيمة وسطية",
  5:"أفضلية قوية",
  6:"قيمة وسطية",
  7:"أفضلية قوية جدًا",
  8:"قيمة وسطية",
  9:"أفضلية مطلقة"
};

const RI = {
  1:0,
  2:0,
  3:0.58,
  4:0.90,
  5:1.12
};

/* جميع المؤشرات تبدأ في المنتصف (أهمية متساوية) */
const D = {
  c:[0,0,0],

  a:[
    [0,0,0],
    [0,0,0],
    [0,0,0]
  ]
};

let S = {
  c:[...D.c],
  a:D.a.map(x => [...x])
};

let step = 0;

const STEPS = 7;


/* =========================
   حسابات AHP
========================= */

function calc(v,n,P){

  const m = Array.from(
    {length:n},
    () => Array(n).fill(1)
  );

  P.forEach(([i,j],k) => {

    const s = Math.abs(v[k]) + 1;

    const a =
      v[k] >= 0
        ? s
        : 1/s;

    m[i][j] = a;
    m[j][i] = 1/a;

  });

  const cs = m[0].map((_,j) =>
    m.reduce(
      (t,r) => t + r[j],
      0
    )
  );

  const w = m.map(r =>
    r.reduce(
      (t,x,j) => t + x/cs[j],
      0
    ) / n
  );

  const lam =
    m
      .map((r,i) =>
        r.reduce(
          (t,x,j) => t + x*w[j],
          0
        ) / w[i]
      )
      .reduce(
        (a,b) => a+b,
        0
      ) / n;

  const ci =
    n > 1
      ? (lam-n)/(n-1)
      : 0;

  const cr =
    RI[n]
      ? ci/RI[n]
      : 0;

  return {
    w,
    lam,
    ci,
    cr
  };
}


/* =========================
   وصف المقارنة
========================= */

function say(v,N,i,j){

  if(v === 0){

    return `
      <b>${N[i]}</b>
      و<b>${N[j]}</b>
      متساويان في الأهمية (1)
    `;

  }

  const degree =
    Math.abs(v) + 1;

  const win =
    N[v > 0 ? i : j];

  const lose =
    N[v > 0 ? j : i];

  return `
    <b>${win}</b>
    أفضل من
    <b>${lose}</b>
    بدرجة ${degree}
    (${NM[degree]})
  `;
}


/* =========================
   إنشاء المقارنات
   (تحريك المؤشر نحو العنصر يجعله الأفضل)
========================= */

function pairs(vals,N,P,key,idx){

  return P.map(([i,j],k) => `

    <div class="pair">

      <div class="l">
        ${N[i]}
      </div>

      <input
        type="range"
        min="-8"
        max="8"
        value="${-vals[k]}"
        oninput="upd('${key}',${idx},${k},-this.value)"
        aria-label="مقارنة بين ${N[i]} و${N[j]}"
      >

      <div class="l">
        ${N[j]}
      </div>

    </div>

    <div class="say" id="sy${k}">
      ${say(vals[k],N,i,j)}
    </div>

  `).join("");
}


/* =========================
   تحديث المقارنة
========================= */

function upd(key,idx,k,val){

  val = Number(val) || 0;

  const N =
    key === "c"
      ? C.map(c => c.split(":")[0])
      : A;

  if(key === "c"){

    S.c[k] = val;

  }else{

    S.a[idx][k] = val;

  }

  const sayEl =
    document.getElementById("sy" + k);

  if(sayEl){

    sayEl.innerHTML =
      say(
        val,
        N,
        P3[k][0],
        P3[k][1]
      );

  }

  live();
}


/* =========================
   فحص الاتساق المباشر
========================= */

function live(){

  const el =
    document.getElementById("live");

  if(!el){
    return;
  }

  const vals =
    step === 2
      ? S.c
      : S.a[step-3];

  const r =
    calc(
      vals,
      3,
      P3
    );

  el.className =
    "cr " +
    (
      r.cr <= 0.1
        ? "ok"
        : "no"
    );

  el.innerHTML =
    r.cr <= 0.1
      ? `
        نسبة الاتساق CR =
        ${r.cr.toFixed(2)}
        ✔ أحكامك متسقة
      `
      : `
        نسبة الاتساق CR =
        ${r.cr.toFixed(2)}
        ✘ أحكامك متناقضة، راجعها
      `;
}


/* =========================
   هرم القرار
========================= */

const tree = `

<div class="tree">

<svg
  viewBox="0 0 640 260"
  font-family="Tajawal,Tahoma"
  text-anchor="middle"
>

<g
  stroke="#72B0AB"
  stroke-width="2"
  fill="none"
>

${[530,320,110]
  .map(x =>
    `<path d="M320 52 L${x} 105"/>`
  )
  .join("")}

${[530,320,110]
  .map(x =>
    [530,320,110]
      .map(y =>
        `<path
          d="M${x} 145 L${y} 205"
          opacity=".5"
        />`
      )
      .join("")
  )
  .join("")}

</g>

<rect
  x="170"
  y="12"
  width="300"
  height="40"
  rx="20"
  fill="#72B0AB"
/>

<text
  x="320"
  y="38"
  fill="#fff"
  font-size="16"
  font-weight="700"
>
  الهدف: نظام نقل مستدام
</text>

${C.map((c,i) => `

  <rect
    x="${[530,320,110][i]-100}"
    y="105"
    width="200"
    height="40"
    rx="20"
    fill="#BCDDDC"
  />

  <text
    x="${[530,320,110][i]}"
    y="131"
    fill="#16403d"
    font-size="14"
    font-weight="700"
  >
    ${c}
  </text>

`).join("")}

${A.map((c,i) => `

  <rect
    x="${[530,320,110][i]-100}"
    y="205"
    width="200"
    height="40"
    rx="20"
    fill="#FE9179"
  />

  <text
    x="${[530,320,110][i]}"
    y="231"
    fill="#fff"
    font-size="14"
    font-weight="700"
  >
    ${c}
  </text>

`).join("")}

</svg>

</div>
`;


/* =========================
   أزرار التنقل
========================= */

const nav = (back,lbl) => `

<div class="btns">

  <button
    class="g"
    ${back
      ? `onclick="go(${step-1})"`
      : "disabled"}
  >
    → السابق
  </button>

  <button
    onclick="go(${step+1})"
  >
    ${lbl || "التالي ←"}
  </button>

</div>

`;

const tg = n =>
  `<span class="tag">الخطوة ${n} من ${STEPS}</span>`;


/* =========================
   شاشة المقارنة
========================= */

function cmp(
  key,
  idx,
  N,
  title,
  q,
  extra
){

  return `

    ${tg(step+1)}

    <h2>
      ${title}
    </h2>

    <p>
      ${q}
    </p>

    ${extra || ""}

    ${
      pairs(
        key === "c"
          ? S.c
          : S.a[idx],
        N,
        P3,
        key,
        idx
      )
    }

    <div id="live"></div>

    ${nav(true)}

  `;
}


/* =========================
   مقياس ساعاتي
========================= */

const scale = `

<table>

<tr>
  <th>الدرجة</th>
  <th>المعنى (مقياس ساعاتي)</th>
</tr>

<tr>
  <td>1</td>
  <td>متساوية</td>
</tr>

<tr>
  <td>3</td>
  <td>متوسطة</td>
</tr>

<tr>
  <td>5</td>
  <td>قوية</td>
</tr>

<tr>
  <td>7</td>
  <td>قوية جدًا</td>
</tr>

<tr>
  <td>9</td>
  <td>مطلقة</td>
</tr>

</table>

`;


/* =========================
   عرض الخطوات
========================= */

function render(){

  const v =
    document.getElementById("view");

  if(!v){
    return;
  }

  let h = "";


/* =========================
   الخطوة 1: السيناريو
========================= */

  if(step === 0){

    h = `

      ${tg(1)}

      <h2>
        السيناريو
      </h2>

      <p>
        أنت عضو في لجنة تخطيط حضري، وعليك اختيار
        نظام النقل الأنسب لمدينتك من بين ثلاثة بدائل:
      </p>

      <div class="box w" style="text-align:center;margin:12px 0">
        <b>${A.join(" • ")}</b>
      </div>

      <p>
        ستقوم بتقييم المعايير ثم البدائل وذلك وفق
        المقارنات الثنائية، وفي النهاية ستظهر نتيجة التقييم.
      </p>

      ${nav(false,"ابدأ ←")}

    `;
  }


/* =========================
   الخطوة 2: هرم القرار
========================= */

  else if(step === 1){

    h = `

      ${tg(2)}

      <h2>
        هرم القرار
      </h2>

      ${tree}

      ${nav(true)}

    `;
  }


/* =========================
   الخطوة 3: مقارنة المعايير
========================= */

  else if(step === 2){

    h = cmp(
      "c",
      0,
      C.map(c => c.split(":")[0]),
      "قارن المعايير",
      "أي المعيارين أهم في نظرك؟ حرّك المؤشر نحوه، والمنتصف يعني التساوي.",
      scale
    );

  }


/* =========================
   الخطوات 4–6: مقارنة البدائل
========================= */

  else if(step >= 3 && step <= 5){

    const k = step - 3;

    h = cmp(
      "a",
      k,
      A,
      "قارن البدائل وفق المعيار " +
        C[k].split(":")[0],
      `فكّر في <span class="k">${C[k]}</span> فقط، وحرّك المؤشر نحو البديل الأفضل.`
    );

  }


/* =========================
   الخطوة 7: النتيجة
========================= */

  else {

    const wc =
      calc(
        S.c,
        3,
        P3
      );

    const wa =
      S.a.map(a =>
        calc(
          a,
          3,
          P3
        )
      );

    const sc =
      A.map((_,a) =>
        C.reduce(
          (t,_,k) =>
            t +
            wc.w[k] *
            wa[k].w[a],
          0
        )
      );

    const o =
      sc
        .map((s,i) => [s,i])
        .sort(
          (a,b) => b[0]-a[0]
        );

    const allCr =
      [wc.cr].concat(
        wa.map(x => x.cr)
      );

    const bad =
      allCr.findIndex(x => x > 0.1);

    h = `

      ${tg(7)}

      <h2>
        النتيجة
      </h2>

      <div class="win">

        البديل الأفضل:
        ${A[o[0][1]]}
        (${(o[0][0]*100).toFixed(1)}%)

      </div>

      <h3>
        أوزان المعايير
      </h3>

      ${
        C.map((c,i) => `

          <div class="bar">

            <span>
              ${c.split(":")[0]}
            </span>

            <div class="t">

              <span
                style="width:${wc.w[i]*100}%"
              ></span>

            </div>

            <b>
              ${(wc.w[i]*100).toFixed(1)}%
            </b>

          </div>

        `).join("")
      }

      <h3>
        ترتيب البدائل
      </h3>

      <table>

        <tr>
          <th>الترتيب</th>
          <th>البديل</th>
          <th>الدرجة</th>
        </tr>

        ${
          o.map(([s,i],n) => `
            <tr>
              <td>${n+1}</td>
              <td>${A[i]}</td>
              <td>${(s*100).toFixed(1)}%</td>
            </tr>
          `).join("")
        }

      </table>

      <div
        class="cr ${bad === -1 ? "ok" : "no"}"
      >

        ${
          bad === -1
            ? "✔ جميع أحكامك متسقة (CR ≤ 0.10)"
            : "✘ بعض أحكامك غير متسقة (CR &gt; 0.10)، راجعها قبل اعتماد النتيجة"
        }

      </div>

      <div class="btns">

        ${
          bad === -1
            ? ""
            : `<button class="g" onclick="go(${bad+2})">→ عدّل أحكامك</button>`
        }

        <button
          onclick="resetSimulation()"
        >
          ↺ ابدأ من جديد
        </button>

      </div>

    `;
  }


  /* =========================
     تحديث الصفحة
  ========================= */

  v.innerHTML = h;

  const prog =
    document.getElementById("prog");

  if(prog){

    prog.innerHTML =
      Array.from(
        {length:STEPS},
        (_,i) =>
          `<i class="${i <= step ? "on" : ""}"></i>`
      ).join("");

  }

  if(step >= 2 && step <= 5){
    live();
  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   الانتقال بين الخطوات
========================= */

function go(n){

  step =
    Math.max(
      0,
      Math.min(
        STEPS-1,
        n
      )
    );

  render();
}


/* =========================
   إعادة المحاكاة
========================= */

function resetSimulation(){

  S = {
    c:[...D.c],
    a:D.a.map(x => [...x])
  };

  step = 0;

  render();
}


/* =========================
   حساب ارتفاع الرأس
========================= */

function hh(){

  const header =
    document.querySelector("header");

  if(!header){
    return;
  }

  document.documentElement.style.setProperty(
    "--hh",
    header.offsetHeight + "px"
  );
}

window.addEventListener(
  "resize",
  hh
);

hh();

if(
  document.fonts &&
  document.fonts.ready
){

  document.fonts.ready.then(hh);

}


/* =========================
   تشغيل المحاكاة
========================= */

render();

</script>

</body>
</html>
